project:
  name: "Bike-Share Forecast, Allocate, Rebalance"
  stakeholder: "Bike-share operations planning manager"
  timezone: "America/Toronto"

paths:
  source_hour_csv: "/Users/devshah/Downloads/archive/hour.csv"
  source_day_csv: "/Users/devshah/Downloads/archive/day.csv"
  source_readme: "/Users/devshah/Downloads/archive/Readme.txt"

modeling:
  target_column: "cnt"
  date_column: "dteday"
  hour_column: "hr"
  collapse_weathersit_4_to_3: true
  drop_partial_days_from_modeling: true
  holdout_start_date: "2012-10-01"
  anomaly_dates:
    - "2012-10-29"
  include_anomaly_in_primary_holdout: false
  cv:
    n_folds: 4
    validation_days: 14
    min_train_days: 180
  forecast_reference_date: "2012-12-31"
  forecast_horizon_hours: 24

features:
  categorical:
    - "season"
    - "mnth"
    - "hr"
    - "weekday"
    - "workingday"
    - "holiday"
    - "weathersit"
    - "yr"
  numeric:
    - "temp"
    - "hum"
    - "windspeed"
    - "hour_sin"
    - "hour_cos"
    - "weekday_sin"
    - "weekday_cos"
    - "month_sin"
    - "month_cos"
    - "lag_24"
    - "lag_168"
    - "rolling_mean_24"
    - "rolling_mean_168"
    - "same_hour_mean_7"
    - "temp_workingday"
    - "hum_weathersit"
    - "is_anomaly_day"
    - "is_complete_day"

optimization:
  shortage_cost: 5.0
  idle_cost: 1.0
  move_cost: 0.5
  total_fleet_size: 1000
  move_capacity: 300
  default_service_hours:
    workingday: [7, 8, 9, 16, 17, 18]
    non_workingday: [11, 12, 13, 14, 15]
  default_zone_shares:
    workingday:
      Residential: 0.42
      "Employment Core": 0.43
      "Leisure/Mixed Use": 0.15
    non_workingday:
      Residential: 0.25
      "Employment Core": 0.20
      "Leisure/Mixed Use": 0.55
  default_current_inventory:
    Residential: 310
    "Employment Core": 350
    "Leisure/Mixed Use": 240

scenarios:
  bad_weather:
    temp_delta: -0.08
    hum_delta: 0.08
    windspeed_delta: 0.05
    weathersit_shift: 1
  commuter_surge:
    demand_multiplier: 1.12
  forecast_error_stress:
    forecast_multiplier: 1.1
  lower_fleet:
    total_fleet_size: 850
  higher_shortage_cost:
    shortage_cost: 8.0
  higher_idle_cost:
    idle_cost: 2.0
  higher_move_cost:
    move_cost: 1.0

dashboard:
  default_date: "2012-12-31"
